name: classification-registry

# The daily run is intentionally incremental: only new NSE EQ/BE listings,
# symbol renames, and due retries are eligible. The quarterly run invokes the
# same safe collector in a resumable campaign (100 x 25-symbol batches) so
# every active equity is re-audited without making this expensive crawl part of
# the daily data-ingestion path.
on:
  schedule:
    - cron: "30 1 * * 1-5"          # 07:00 IST: new/renamed/retry only
    - cron: "0 2 1 1,4,7,10 *"      # quarterly full active-universe audit
  workflow_dispatch:
    inputs:
      mode:
        description: "daily is incremental; baseline advances the initial backlog; quarterly audits all active equities"
        required: true
        type: choice
        default: baseline
        options: [daily, baseline, quarterly]
      batch_size:
        description: "Sequential Screener requests per batch (1-25)"
        required: true
        default: "25"
      max_batches:
        description: "Optional cap for this dispatch; quarterly defaults to 100"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: data-pipeline-publish
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: pipeline
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.lock -e . --no-deps
      - name: Sync persisted classification state from data-latest
        run: python -m pipeline sync
      - name: Collect classifications
        id: collect
        env:
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_BATCH_SIZE: ${{ github.event.inputs.batch_size }}
          INPUT_MAX_BATCHES: ${{ github.event.inputs.max_batches }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          mode="${INPUT_MODE:-daily}"
          if [ "$SCHEDULE" = "0 2 1 1,4,7,10 *" ]; then mode="quarterly"; fi
          batch_size="${INPUT_BATCH_SIZE:-25}"
          set -- classification-collect --mode "$mode" --batch-size "$batch_size"
          if [ -n "$INPUT_MAX_BATCHES" ]; then set -- "$@" --max-batches "$INPUT_MAX_BATCHES"; fi
          python -m pipeline "$@"
          jq . data/meta/classification_collection_status.json >> "$GITHUB_STEP_SUMMARY"
      - name: Publish registry state and any coverage-approved scanner artifact
        run: python -m pipeline publish
      - name: Alert on controlled Screener deferral or an unexpected publication failure
        if: always() && steps.collect.outcome == 'success'
        working-directory: ${{ github.workspace }}
        run: |
          report=pipeline/data/meta/classification_collection_status.json
          [ -f "$report" ] || exit 0
          deferred=$(jq -r '.deferred_reason // empty' "$report")
          publication=$(jq -r '.publication.status // empty' "$report")
          message=$(jq -r '.publication.message // empty' "$report")
          mode=$(jq -r '.mode // empty' "$report")
          audit_complete=$(jq -r '.audit_complete // false' "$report")
          if [ -z "$deferred" ] && { [ "$publication" != "failed" ] || [[ "$message" == *"coverage guard"* ]]; } && { [ "$mode" != "quarterly" ] || [ "$audit_complete" = "true" ]; }; then exit 0; fi
          gh label create pipeline-failure --color B60205 --force >/dev/null 2>&1 || true
          body="classification-registry needs attention on $(date -u +%F): deferred=${deferred:-none}; publication=${publication:-unknown}; message=${message:-none}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          n=$(gh issue list --label pipeline-failure --state open --json number -q '.[0].number' || true)
          if [ -z "$n" ]; then
            gh issue create --title "Data pipeline: classification registry needs attention" --label pipeline-failure --body "$body"
          else
            gh issue comment "$n" --body "$body"
          fi
      - name: Alert on failure
        if: failure() || cancelled()
        working-directory: ${{ github.workspace }}
        run: |
          gh label create pipeline-failure --color B60205 --force >/dev/null 2>&1 || true
          body="classification-registry FAILED on $(date -u +%F). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          n=$(gh issue list --label pipeline-failure --state open --json number -q '.[0].number' || true)
          if [ -z "$n" ]; then
            gh issue create --title "Data pipeline: classification-registry failed" --label pipeline-failure --body "$body"
          else
            gh issue comment "$n" --body "$body"
          fi
